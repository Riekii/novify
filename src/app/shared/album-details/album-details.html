<div class="detail-container">

    <div class="detail-content-container">
        <div (click)="close.emit(!close)" class="close">x</div>
        <div class="cover" [style.background-image]="coverArt ? 'url(' + coverArt + ')' : 'none'">

            <div class="title">{{album?.name}} - {{album?.artist}}</div>

            <div class="songList">
                <div class="song" *ngFor="let song of songs">
                    <button class="play" (click)="playSong(song)">▶</button>
                    <p class="name">{{song.title}}</p>
                    <p class="duration">{{song.duration}}</p>
                </div>
            </div>

        </div>

        
    </div>
</div>
