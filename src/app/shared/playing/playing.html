<div class="playing-container" *ngIf="audioState$ | async as state">
  <div class="player-card" *ngIf="state.currentSong">
    <div class="song-info">
      <h3>{{ state.currentSong.title }}</h3>
      <p>{{ state.currentSong.artist || 'Artista desconocido' }}</p>
    </div>
    <div class="controls">



      <button (click)="playRandomSong()" class="play-btn forward-btn">
        <fa-icon [icon]="faBackward"></fa-icon>
      </button>

      <button (click)="togglePlayPause()" class="play-btn">
        <fa-icon
          *ngIf="(audioState$ | async)?.isPlaying && (audioState$ | async)?.currentSong?.id === state.currentSong?.id"
          [icon]="faPause" />
        <fa-icon
          *ngIf="!(audioState$ | async)?.isPlaying || (audioState$ | async)?.currentSong?.id !== state.currentSong?.id"
          [icon]="faPlay" />
      </button>

      <button (click)="playRandomSong()" class="play-btn forward-btn">
        <fa-icon [icon]="faForward"></fa-icon>
      </button>
    </div>





    <div class="progress-section">
      <span class="time">{{ formatTime(state.currentTime) }}</span>
      <input type="range" min="0" [max]="state.duration" [value]="state.currentTime" (change)="onProgressChange($event)"
        class="progress-bar" />
      <span class="time">{{ formatTime(state.duration) }}</span>
    </div>
  </div>
</div>
