<div class="songs">
    <input
        class="search"
        type="search"
        placeholder="Buscar canciones, artistas o álbumes..."
        [value]="query"
        (input)="onSearch($any($event.target).value)" />

    <div class="header">
        <span class="col-play"></span>
        <span class="col-title">Título</span>
        <span class="col-artist">Artista</span>
        <span class="col-album" *ngIf="!isMobile">Álbum</span>
        <span class="col-format">Formato</span>
        <span class="col-duration">Duración</span>
        <span class="col-add"></span>
    </div>

    @let state = audioState$ | async;
    @for (song of songs; track song.id) {
        @let isCurrent = state?.currentSong?.id === song.id;
        <app-song
            [song]="song"
            [isMobile]="isMobile"
            [playlists]="playlists"
            [isCurrent]="isCurrent"
            [isPlaying]="isCurrent && !!state?.isPlaying"
            [currentTime]="isCurrent ? (state?.currentTime ?? 0) : 0"
            [duration]="isCurrent ? (state?.duration ?? 0) : 0"
            (play)="playSong($event)"
            (addToPlaylist)="addToPlaylist($event.song, $event.playlistId)" />
    }

    @if (message) {
        <p class="toast">{{ message }}</p>
    }

    @if (loading) {
        <p class="status">Cargando...</p>
    } @else if (songs.length === 0) {
        <p class="status">No se encontraron canciones.</p>
    }

    <div #sentinel class="sentinel"></div>
</div>
